# nginx del front-end (step 9): file statici dell'interfaccia e proxy /api verso il back-end.
# Stessa regola del proxy di Vite in sviluppo: il browser chiama /api/..., nginx toglie /api.
server {
    listen 80;
    server_name _;

    # DNS interno di Docker: con il nome in una variabile nginx lo risolve a ogni richiesta (cache 10 s),
    # così un back-end ricreato con un IP nuovo si raggiunge senza riavviare il front-end
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: verso il servizio "backend" sulla rete interna di Compose
    location /api/ {
        set $backend backend:8001;
        # toglie /api (con una variabile in proxy_pass il percorso si riscrive qui)
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        # host e porta del browser: i redirect del back-end usano l'indirizzo pubblicato
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # un redirect del back-end (es. /chat/ → /chat) torna sotto /api
        proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/api/$2;
        # una risposta con le revisioni può durare minuti: oltre AGENTE_TIMEOUT (300 s), così il
        # 504 lo dà il back-end con il suo messaggio
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    # interfaccia: file statici; ogni percorso sconosciuto torna all'unica pagina
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
