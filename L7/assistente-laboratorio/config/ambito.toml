# Ambito dell'agente: di cosa puo' parlare. Il router lo legge per decidere se una domanda
# va all'agente (conversazione) o riceve il rifiuto (fuori_ambito).
# Si modifica senza toccare il codice; il percorso del file si cambia con AMBITO_FILE.

# di cosa puo' parlare l'agente: entra nel prompt del router
descrizione = """
Assistente di laboratorio: ora, data e fusi orari, concetti della lezione e la conversazione
in corso.
"""

# esempi che aiutano il modello piccolo a decidere (facoltativi)
esempi_in_ambito = ["Che ore sono a Tokyo?", "Che giorno è oggi?", "Ciao, cosa sai fare?",
                    "Spiegami cos'è il Model Context Protocol", "Riassumi la nostra conversazione"]
esempi_fuori_ambito = ["Dammi la ricetta della carbonara", "Quanti km sono 10 miglia?", "Scrivi una funzione Python",
                       "Spiegami la storia dell'Impero romano"]

# risposta fissa del nodo rifiuto (nessuna chiamata al modello)
rifiuto = "Posso aiutarti solo con ora, data e fusi orari, con i concetti della lezione (MCP, LangGraph, agenti, LLM) e con la nostra conversazione. Questa domanda è fuori dal mio ambito."

# argomenti in ambito: il router sceglie uno di questi nomi oppure "altro" (= fuori ambito);
# "altro" e' riservato e non va scritto qui
# (in fondo al file: in TOML le chiavi scritte dopo [[argomenti]] finirebbero dentro la tabella)
[[argomenti]]
nome = "ora_data_fusi"
descrizione = "ora e data correnti in Italia o in qualunque luogo del mondo, fusi orari (che fuso usa una città, differenza di orario tra due luoghi)"

[[argomenti]]
nome = "concetti_lezione"
descrizione = "spiegare i concetti della lezione: Model Context Protocol (MCP), LangGraph, agenti, LLM"

[[argomenti]]
nome = "conversazione_in_corso"
descrizione = "riassumere o ricordare la conversazione in corso"

[[argomenti]]
nome = "saluti"
descrizione = "saluti, ringraziamenti e domande sull'assistente stesso (cosa sa fare, come si usa)"
