services:
  app:
    build: .
    image: assistente-laboratorio-l5
    environment:
      # LM Studio gira sull'host: 127.0.0.1 nel container sarebbe il container stesso.
      # Non si usa LM_BASE_URL: il .env locale (L5/.env) contiene 127.0.0.1 e Compose lo leggerebbe.
      LM_BASE_URL: ${DOCKER_LM_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_MODEL: ${LM_MODEL:-google/gemma-4-e2b}
      MAX_STEPS: ${MAX_STEPS:-5}
      FUSO_PREDEFINITO: ${FUSO_PREDEFINITO:-Europe/Rome}
      # il servizio calcolatrice si raggiunge per nome sulla rete interna di Compose
      CALC_BASE_URL: http://calcolatrice:8001
    depends_on:
      # l'app parte solo quando il servizio risponde a /salute
      calcolatrice:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

  calcolatrice:
    build: .
    image: assistente-laboratorio-l5
    command: ["python", "-m", "uvicorn", "servizio.main:app", "--host", "0.0.0.0", "--port", "8001"]
    # nessun "ports": la porta 8001 serve solo all'app, non e' pubblicata sull'host
    healthcheck:
      # l'immagine slim non ha curl: il controllo usa Python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/salute', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
