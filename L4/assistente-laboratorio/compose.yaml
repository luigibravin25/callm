services:
  app:
    build: .
    # .env e' facoltativo; i valori in environment hanno la precedenza
    env_file:
      - path: .env
        required: false
    environment:
      # LM Studio gira sull'host: 127.0.0.1 nel container sarebbe il container stesso
      LM_BASE_URL: ${LM_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_MODEL: ${LM_MODEL:-google/gemma-4-e2b}
      MAX_STEPS: ${MAX_STEPS:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
